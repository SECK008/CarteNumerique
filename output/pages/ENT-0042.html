<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maimouna Mbaye — Teranga Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1F2A;
    --ink-soft: #5B6270;
    --gold: #C9A227;
    --paper: #FBFAF7;
    --card: #FFFFFF;
    --line: #E7E4DB;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #F2F0EA; --ink-soft: #A9AFBC;
      --paper: #14161C; --card: #1C1F27; --line: #2B2F3A;
    }
  }
  :root[data-theme="dark"] {
    --ink: #F2F0EA; --ink-soft: #A9AFBC;
    --paper: #14161C; --card: #1C1F27; --line: #2B2F3A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .sheet { width: 100%; max-width: 420px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand img, .brand svg { width: 34px; height: 34px; flex-shrink: 0; }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; }
  .brand-name span { display: block; font-size: 10px; color: var(--ink-soft); font-weight: 400; }

  .eyebrow {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin: 0 4px 8px;
  }

  /* --- Recto : informations --- */
  .face-recto {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  .face-recto::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gold);
  }
  .card-top { display: flex; justify-content: flex-end; align-items: center; gap: 14px; padding: 24px 24px 0; }
  .photo { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
  .id-badge {
    font-family: 'Space Grotesk', monospace; font-size: 13px; letter-spacing: 0.04em;
    color: var(--ink-soft); border: 1px solid var(--line); border-radius: 100px; padding: 5px 12px;
  }
  .name-block { padding: 18px 24px 4px; }
  .name-block .prenom { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1; }
  .name-block .nom { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 26px; line-height: 1.1; color: var(--ink-soft); }
  .divider { height: 1px; background: var(--line); margin: 20px 24px; }
  .info-list { padding: 0 24px 26px; display: flex; flex-direction: column; gap: 16px; }
  .info-row { display: flex; gap: 14px; align-items: flex-start; }
  .info-icon { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; color: var(--gold); }
  .info-text .label { font-size: 11px; color: var(--ink-soft); margin-bottom: 2px; }
  .info-text .value { font-size: 15px; font-weight: 500; }

  /* --- Verso : logo, au même format que la carte physique (CR80) --- */
  .gap { height: 28px; }
  .face-verso {
    background: var(--ink);
    border-radius: 10px;
    aspect-ratio: 85.6 / 54;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .face-verso .logo-mark svg, .face-verso .logo-mark img { width: 56px; height: 56px; display: block; object-fit: contain; }
  .face-verso .company {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 4vw, 18px);
    letter-spacing: 0.06em;
    color: var(--paper);
    text-align: center;
    padding: 0 16px;
  }

  .foot-note { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 20px; }
</style>
</head>
